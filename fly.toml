# App name must be globally unique on Fly. Rename if `fly launch` reports a conflict.
app = "graph-cafe"
primary_region = "iad"

[build]

[env]
  GRAPH_CAFE_DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

# One volume = one machine. Do not scale to multiple machines until storage is shared (DB/R2).
[mounts]
  source = "graph_cafe_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
